---
# ==============================================================================
# Master Pipeline: K-12 District Identity Lifecycle Automation & Reconciliation
# ==============================================================================
- name: End-to-End K-12 District Identity Lifecycle Automation Pipeline
  hosts: localhost
  gather_facts: true

  vars_files:
    - vars/vault.yml

  vars:
    db_host: "{{ db_host | default('10.2.8.106') }}"
    db_port: "{{ db_port | default(5432) }}"
    db_name: "{{ db_name | default('hr_db') }}"
    log_archive_dir: "/var/log/hr_pipeline"

  vars_prompt:
    - name: req_hires
      prompt: "How many NEW ENROLLMENTS / HIRES do you want to generate?"
      default: "3"
      private: false

    - name: req_transfers
      prompt: "How many PROMOTIONS / CAMPUS TRANSFERS do you want to generate?"
      default: "1"
      private: false

    - name: req_terms
      prompt: "How many WITHDRAWALS / SEPARATIONS do you want to generate?"
      default: "1"
      private: false

  tasks:
    # =========================================================================
    # Phase 0: Persistent Log Archival & Timing Setup
    # =========================================================================
    - name: "Phase 0 | Capture Pipeline Start Timestamp"
      ansible.builtin.copy:
        content: "{{ ansible_date_time.epoch }}"
        dest: "/tmp/pipeline_start_time"
        mode: '0644'

    - name: "Phase 0 | Ensure persistent log archive directory exists"
      ansible.builtin.file:
        path: "{{ log_archive_dir }}"
        state: directory
        mode: '0755'

    # =========================================================================
    # Phase 1: K-12 SIS Data Stream Event Generation
    # =========================================================================
    - name: "Phase 1 | Execute K-12 SIS Identity Event Generator"
      ansible.builtin.command:
        cmd: >
          python3 scripts/generate_hr_data.py
          --hires {{ req_hires }}
          --transfers {{ req_transfers }}
          --terms {{ req_terms }}
      register: hr_script_output
      changed_when: true

    - name: "Phase 1 | Save Live Generator Log to Disk (/tmp Staging)"
      ansible.builtin.copy:
        content: "{{ hr_script_output.stdout | default('') }}"
        dest: "/tmp/hr_gen_output.log"
        mode: '0644'

    - name: "Phase 1 | Archive Timestamped SIS Event Execution Log"
      ansible.builtin.copy:
        content: "{{ hr_script_output.stdout | default('') }}"
        dest: "{{ log_archive_dir }}/sis_gen_{{ ansible_date_time.date }}_{{ ansible_date_time.time | replace(':', '-') }}.log"
        mode: '0644'

    - name: "Phase 1 | Display Processed SIS Lifecycle Events"
      ansible.builtin.debug:
        msg: "{{ hr_script_output.stdout_lines }}"

    # =========================================================================
    # Phase 2: Multi-System Sync Execution (site.yml)
    # =========================================================================
    - name: "Phase 2 | Trigger Master Synchronization Playbook (site.yml)"
      ansible.builtin.command:
        cmd: >
          ansible-playbook -i /root/ansible/inventory/hosts.ini
          /root/ansible/playbooks/site.yml
          --vault-password-file /root/ansible/vars/.vault_pass
          -f 20
      environment:
        ANSIBLE_HOST_KEY_CHECKING: "False"
      register: sync_result
      ignore_errors: true

    - name: "Phase 2 | Save Live Pipeline Stdout Log to Disk (/tmp Staging)"
      ansible.builtin.copy:
        content: "{{ sync_result.stdout | default('') }}"
        dest: "/tmp/pipeline_stdout.log"
        mode: '0644'

    - name: "Phase 2 | Archive Timestamped Pipeline Execution Log"
      ansible.builtin.copy:
        content: "{{ sync_result.stdout | default('') }}"
        dest: "{{ log_archive_dir }}/pipeline_sync_{{ ansible_date_time.date }}_{{ ansible_date_time.time | replace(':', '-') }}.log"
        mode: '0644'

    # =========================================================================
    # Phase 3: Console Summary
    # =========================================================================
    - name: "Phase 3 | Render Executive Lifecycle Summary"
      ansible.builtin.debug:
        msg: |
          =====================================================
               K-12 DISTRICT IDENTITY SYNC EXECUTION RESULTS   
          =====================================================
          {{ sync_result.stdout }}

    # =========================================================================
    # Phase 4: High-Speed Multi-Endpoint Audit & Report Publishing
    # =========================================================================
    - name: "Phase 4 | Ensure reports directory exists locally"
      ansible.builtin.file:
        path: "/root/ansible/reports"
        state: directory
        mode: '0755'

    - name: "Phase 4 | Execute K-12 Reconciliation Audit Engine"
      ansible.builtin.command:
        cmd: "python3 scripts/audit_reconciliation.py"
      environment:
        AUTHENTIK_URL: "{{ vault_authentik_url }}"
        AUTHENTIK_TOKEN: "{{ vault_authentik_token }}"
        DB_HOST: "{{ db_host }}"
        DB_PORT: "{{ db_port | string }}"
        DB_NAME: "{{ db_name }}"
        DB_USER: "{{ vault_db_user }}"
        DB_PASSWORD: "{{ vault_db_password }}"
        AD_HOST: "10.2.8.67"
        AD_USER: "{{ vault_ad_user | default(vault_ad_username | default(vault_winrm_user | default(vault_ad_admin_user | default('Administrator')))) }}"
        AD_PASSWORD: "{{ vault_ad_password | default(vault_ad_pass | default(vault_winrm_password | default(vault_ad_admin_password | default(vault_ssh_password | default(''))))) }}"
        AD_DOMAIN: "{{ ad_domain | default('apex.lab') }}"
      register: audit_exec_output

    - name: "Phase 4 | Display Reconciliation Engine Audit Summary"
      ansible.builtin.debug:
        msg: "{{ audit_exec_output.stdout_lines }}"

    - name: "Phase 4 | Publish HTML Reports to Nginx Web Root on 10.2.8.68"
      ansible.builtin.copy:
        src: "/root/ansible/reports/"
        dest: "/var/www/html/"
        mode: '0644'
      delegate_to: 10.2.8.68
      vars:
        ansible_connection: ssh
        ansible_port: 22
        ansible_user: "{{ vault_ssh_user }}"
        ansible_password: "{{ vault_ssh_password }}"