---
- name: Synchronize Active Directory Groups and Membership
  hosts: win_dc
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../../vars/vault.yml"

  tasks:
    - name: Ensure Security Groups exist inside Departments OU
      microsoft.ad.group:
        domain_username: "{{ vault_ad_admin_user }}"
        domain_password: "{{ vault_ad_admin_password }}"
        domain_server: "{{ ad_hostname | default(ansible_host) }}"
        name: "{{ item.group }}"
        scope: global
        category: security
        path: "OU=Departments,OU=APEX Lab,DC=apex,DC=lab"
        state: present
      loop: "{{ lookup('ansible.builtin.file', '/tmp/dynamic_ad_group_assignments.json', errors='ignore') | default('[]', true) | from_json }}"
      loop_control:
        label: "{{ item.group }}"

    - name: Update group member assignments in Active Directory
      microsoft.ad.group:
        domain_username: "{{ vault_ad_admin_user }}"
        domain_password: "{{ vault_ad_admin_password }}"
        domain_server: "{{ ad_hostname | default(ansible_host) }}"
        name: "{{ item.group }}"
        path: "OU=Departments,OU=APEX Lab,DC=apex,DC=lab"
        members:
          add: "{{ item.members.add }}"
        state: present
      loop: "{{ lookup('ansible.builtin.file', '/tmp/dynamic_ad_group_assignments.json', errors='ignore') | default('[]', true) | from_json }}"
      when: item.members is defined and item.members.add is defined and (item.members.add | length > 0)
      loop_control:
        label: "{{ item.group }}"