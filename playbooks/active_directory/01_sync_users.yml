---
- name: Sync Active HR Users to Active Directory
  hosts: win_dc
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../../vars/vault.yml"

  tasks:
    - name: Load active users JSON from controller
      ansible.builtin.set_fact:
        active_users_raw: "{{ lookup('ansible.builtin.file', '/tmp/dynamic_ad_users.json') | from_json }}"
      delegate_to: localhost
      run_once: true

    - name: Normalize active users data to a list
      ansible.builtin.set_fact:
        active_users_list: >-
          {{
            active_users_raw.dynamic_ad_users
            if (active_users_raw is mapping and 'dynamic_ad_users' in active_users_raw)
            else (active_users_raw if active_users_raw is sequence else [])
          }}

    - name: Ensure active users exist in Active Directory
      microsoft.ad.user:
        domain_username: "{{ vault_ad_admin_user }}"
        domain_password: "{{ vault_ad_admin_password }}"
        domain_server: "{{ ad_hostname }}"
        name: "{{ item.first_name }} {{ item.last_name }}"
        given_name: "{{ item.first_name }}"
        surname: "{{ item.last_name }}"
        sam_account_name: "{{ item.username }}"
        user_principal_name: "{{ item.username }}@{{ ad_domain }}"
        mail: "{{ item.email }}"
        path: "OU=APEX Lab,DC=apex,DC=lab"
        state: present
        enabled: true
        password: "{{ default_user_password }}"
        password_never_expires: true
      loop: "{{ active_users_list }}"
      loop_control:
        label: "{{ item.username }}"