# The [defaults] section controls Ansible's core behavior, file paths, logging, and speed settings
[defaults]
# Automatically reads our hidden vault password file so Ansible can decrypt vault.yml
# without prompting for a password or needing "--vault-password-file" on every command.
vault_password_file = /root/ansible/vars/.vault_pass

# Default location of our server list (localhost, Windows Domain Controller, etc.)
# so we don't have to type "-i inventory/hosts" every time we run a playbook.
inventory = inventory/hosts

# Hides yellow "feature will be removed in a future version" notices so terminal output stays clean
deprecation_warnings = False

# Hide all skipped hosts and skipped loop items completely
# Prevents conditional tasks (like "when: expired_users | length > 0") from cluttering the terminal log when skipped
display_skipped_hosts = False

# Use clean YAML output
# Uses Ansible's standard output logger combined with multi-line YAML formatting (much easier
# to read during debugging and demos than cramped single-line JSON output).
stdout_callback = default
result_format = yaml

# Performance Optimizations
# Allows Ansible to execute tasks across up to 20 hosts simultaneously in parallel (default is 5)
forks = 20

# "explicit" tells Ansible NOT to collect OS/hardware facts automatically at the start of every play
# unless a playbook specifically asks for it with "gather_facts: true"—saving seconds on every run.
gathering = explicit

# The [ssh_connection] section tunes how Ansible communicates with Linux hosts over SSH
[ssh_connection]
# Streams commands directly over an open SSH session instead of uploading temporary files for every
# single task—cutting SSH overhead and speeding up Linux playbook execution significantly.
pipelining = True

# SSH connection pooling (multiplexing):
# ControlMaster=auto + ControlPersist=60s keeps an authenticated SSH tunnel open in the background
# for 60 seconds so back-to-back tasks reuse the existing connection instead of re-authenticating.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s