# Three dashes mark the start of a YAML playbook file for Ansible
---
# --- Step 3: Disable or permanently delete terminated users in Authentik SSO ---
- name: Step 3 - Deprovision Inactive Accounts & Manage Retention in Authentik
  # "hosts: localhost" runs this on our Linux Ansible control machine—Python talks to
  # PostgreSQL and Authentik over the network, so it doesn't need SSH.
  hosts: localhost
  # Skip Ansible's automatic system info check at the start to save a couple of seconds
  gather_facts: false

  # Load our encrypted password file (created with ansible-vault) so secrets aren't in plain text.
  # {{ playbook_dir }} automatically points to whatever folder this playbook file is saved in.
  vars_files:
    - "{{ playbook_dir }}/../../vars/vault.yml"

  # Connection details for our simulated SIS database running in PostgreSQL
  vars:
    db_host: "10.2.8.106"
    db_port: 5432
    db_name: "hr_db"

  tasks:
    # "ansible.builtin.command" runs a Linux command—here, "python3 -c" runs an inline Python script directly.
    # The pipe "|" lets us write a clean multi-line script inside YAML.
    - name: Execute High-Speed Direct PostgreSQL & Authentik Deprovisioning Engine
      ansible.builtin.command:
        cmd: |
          python3 -c "
          # Import built-in Python tools for env variables, web requests, JSON, SSL, and parallel threads
          import os, sys, urllib.request, json, ssl, time
          from concurrent.futures import ThreadPoolExecutor
          # psycopg2 connects Python to PostgreSQL; RealDictCursor lets us read columns by name (like hr['username'])
          import psycopg2
          from psycopg2.extras import RealDictCursor

          # Tell Python to accept Authentik's self-signed lab HTTPS certificate without throwing an error
          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE

          # os.getenv() reads the settings passed in from Ansible's environment block below (with backup defaults).
          # .rstrip('/') removes any extra trailing slash from the Authentik web address.
          raw_url = os.getenv('AUTHENTIK_URL', 'http://10.2.8.105:9000').rstrip('/')
          token = os.getenv('AUTHENTIK_TOKEN')
          db_host = os.getenv('DB_HOST', '10.2.8.106')
          db_port = int(os.getenv('DB_PORT', '5432'))
          db_name = os.getenv('DB_NAME', 'hr_db')
          db_user = os.getenv('DB_USER', 'postgres')
          db_pass = os.getenv('DB_PASSWORD', 'MySecretAnsibleToken123!')

          # Web request headers: attaches our secret API token ('Bearer ...') so Authentik lets us edit users
          headers = {
              'Authorization': f'Bearer {token}',
              'Content-Type': 'application/json'
          }

          # 1. Fetch terminated identities directly from PostgreSQL database
          try:
              conn = psycopg2.connect(host=db_host, port=db_port, dbname=db_name, user=db_user, password=db_pass)
              with conn.cursor(cursor_factory=RealDictCursor) as cur:
                  # COALESCE fills in safe defaults if terminated_at or legal_hold is blank in the database.
                  # EXTRACT(EPOCH ...) / 86400 calculates how many days ago the user left (86,400 seconds = 1 day).
                  cur.execute('''
                      SELECT 
                        username, 
                        email, 
                        COALESCE(terminated_at, NOW())::text AS terminated_at,
                        COALESCE(legal_hold, FALSE) AS legal_hold,
                        ROUND(EXTRACT(EPOCH FROM (NOW() - COALESCE(terminated_at, NOW()))) / 86400) AS days_since_termination
                      FROM employees 
                      WHERE status = 'TERMINATED';
                  ''')
                  # fetchall() grabs every terminated user row returned by the query
                  terminated_records = cur.fetchall()
              conn.close()
          except Exception as e:
              # sys.exit(1) stops the script and tells Ansible this task failed if the database can't be reached
              print(f'[!] DB Query Error: {e}')
              sys.exit(1)

          # If nobody is marked TERMINATED in PostgreSQL, exit cleanly with code 0
          if not terminated_records:
              print('[*] No terminated accounts found in PostgreSQL.')
              sys.exit(0)

          # 2. Fetch existing users from Authentik (Page Size 1000)
          # Store all current Authentik users in a lookup dictionary (username -> user info)
          authentik_users = {}
          page = 1
          # Authentik sends users back in pages of 1,000; keep looping until 'next' is empty
          while True:
              url = f'{raw_url}/api/v3/core/users/?page={page}&page_size=1000'
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, context=ctx, timeout=30) as resp:
                      data = json.loads(resp.read().decode())
                      results = data.get('results', [])
                      for u in results:
                          authentik_users[u.get('username')] = u
                      if not data.get('pagination', {}).get('next'):
                          break
                      page += 1
              except Exception as e:
                  print(f'Fetch page {page} error: {e}')
                  break

          # 3. Categorize accounts for offboarding actions
          # Two to-do lists: accounts to turn off vs. accounts to permanently delete
          to_deactivate = []
          to_purge = []

          for hr in terminated_records:
              username = hr.get('username')
              # Only process people who actually have an account in Authentik
              if username in authentik_users:
                  user_obj = authentik_users[username]
                  # 'pk' (primary key) is Authentik's internal ID number for that user
                  pk = user_obj.get('pk')
                  is_active = user_obj.get('is_active', False)
                  legal_hold = bool(hr.get('legal_hold', False))
                  days_since_term = int(float(hr.get('days_since_termination') or 0))

                  # Retention rule:
                  # - Within 30 days: turn off login (deactivate) if still active
                  # - Over 30 days AND no legal hold: permanently delete (purge)
                  # - Over 30 days WITH a legal hold: stays disabled and preserved
                  if days_since_term <= 30 and is_active:
                      to_deactivate.append((username, pk))
                  elif days_since_term > 30 and not legal_hold:
                      to_purge.append((username, pk))

          # 4. Parallel worker functions
          # Sends a PATCH web request to set is_active = False (locks their SSO login)
          def deactivate(item):
              username, pk = item
              url = f'{raw_url}/api/v3/core/users/{pk}/'
              req = urllib.request.Request(url, headers=headers, method='PATCH', data=json.dumps({'is_active': False}).encode())
              try:
                  with urllib.request.urlopen(req, context=ctx, timeout=10):
                      pass
              except Exception:
                  pass

          # Sends a DELETE web request to permanently remove the account from Authentik
          def purge(item):
              username, pk = item
              url = f'{raw_url}/api/v3/core/users/{pk}/'
              req = urllib.request.Request(url, headers=headers, method='DELETE')
              try:
                  with urllib.request.urlopen(req, context=ctx, timeout=10):
                      pass
              except Exception:
                  pass

          # ThreadPoolExecutor(max_workers=25) runs 25 API calls at the same time instead of one by one
          with ThreadPoolExecutor(max_workers=25) as executor:
              list(executor.map(deactivate, to_deactivate))
              list(executor.map(purge, to_purge))

          print(f'[+] Authentik Deprovisioning Complete: Deactivated {len(to_deactivate)}, Purged {len(to_purge)} expired accounts.')
          "
      # Pass vault passwords and DB connection settings privately into Python as environment variables
      environment:
        AUTHENTIK_URL: "{{ vault_authentik_url }}"
        AUTHENTIK_TOKEN: "{{ vault_authentik_token }}"
        DB_HOST: "{{ db_host }}"
        # "| string" turns the port number 5432 into text because environment variables only hold text
        DB_PORT: "{{ db_port | string }}"
        DB_NAME: "{{ db_name }}"
        DB_USER: "{{ vault_db_user }}"
        DB_PASSWORD: "{{ vault_db_password }}"
      # Save everything Python prints into deprov_result so the next step can display it
      register: deprov_result

    # Print the summary line ("Deactivated X, Purged Y expired accounts") to Ansible's output log
    - name: Display Authentik Deprovisioning Execution Summary
      ansible.builtin.debug:
        msg: "{{ deprov_result.stdout_lines }}"