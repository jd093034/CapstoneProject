---
# =============================================================================
# Play 1: PostgreSQL & Authentik Cleanup (Runs on Host)
# =============================================================================
- name: Environment Reset - Wipe Database and Authentik
  hosts: localhost
  gather_facts: false
  vars_files:
    - /root/ansible/vars/vault.yml

  vars:
    db_host: "10.2.8.106"
    db_port: 5432
    db_name: "hr_db"

  tasks:
    # -------------------------------------------------------------------------
    # 1. PostgreSQL Cleanup (Bulk Truncate - Instant)
    # -------------------------------------------------------------------------
    - name: Purge PostgreSQL HR database tables
      community.postgresql.postgresql_query:
        login_db: "{{ db_name }}"
        login_host: "{{ db_host }}"
        login_port: "{{ db_port }}"
        login_user: "{{ vault_db_user }}"
        login_password: "{{ vault_db_password }}"
        query: |
          DO $$ 
          DECLARE 
              stmt text;
          BEGIN 
              SELECT 'TRUNCATE TABLE ' || string_agg(quote_ident(tablename), ', ') || ' CASCADE;'
              INTO stmt
              FROM pg_tables 
              WHERE schemaname = 'public';
              
              IF stmt IS NOT NULL THEN
                  EXECUTE stmt;
              END IF;
          END $$;

    # -------------------------------------------------------------------------
    # 2. Authentik Bulk Cleanup (Active & Disabled User States)
    # -------------------------------------------------------------------------
    - name: Bulk purge non-system users from Authentik
      ansible.builtin.command:
        cmd: |
          python3 -c "
          import urllib.request, json, ssl, time
          from concurrent.futures import ThreadPoolExecutor

          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE

          headers = {
              'Authorization': 'Bearer {{ vault_authentik_token }}',
              'Content-Type': 'application/json'
          }

          users = []
          system_accounts = {'akadmin', 'anonymous'}

          # Explicitly query both active and disabled user states across paginated results
          for active_flag in ['true', 'false']:
              page = 1
              while True:
                  url = f'{{ vault_authentik_url }}/api/v3/core/users/?is_active={active_flag}&page={page}&page_size=1000'
                  req = urllib.request.Request(url, headers=headers)
                  try:
                      with urllib.request.urlopen(req, context=ctx, timeout=30) as resp:
                          data = json.loads(resp.read().decode())
                          results = data.get('results', [])
                          users.extend(results)
                          if not data.get('pagination', {}).get('next'):
                              break
                          page += 1
                  except Exception as e:
                      print(f'User page {page} fetch failed (is_active={active_flag}): {e}')
                      break

          to_delete = list({
              u['pk'] for u in users 
              if u.get('username') not in system_accounts 
              and not u.get('username', '').startswith('ak-outpost-')
          })

          def delete_user(pk):
              url = f'{{ vault_authentik_url }}/api/v3/core/users/{pk}/'
              del_req = urllib.request.Request(url, headers=headers, method='DELETE')
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(del_req, context=ctx, timeout=15) as resp:
                          return
                  except Exception:
                      time.sleep(0.3)

          with ThreadPoolExecutor(max_workers=25) as executor:
              executor.map(delete_user, to_delete)
          "

    - name: Bulk purge custom groups from Authentik
      ansible.builtin.command:
        cmd: |
          python3 -c "
          import urllib.request, json, ssl, time
          from concurrent.futures import ThreadPoolExecutor

          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE

          headers = {
              'Authorization': 'Bearer {{ vault_authentik_token }}',
              'Content-Type': 'application/json'
          }

          groups = []
          page = 1

          # Fetch groups in 1,000-chunk pages to avoid payload timeouts
          while True:
              url = f'{{ vault_authentik_url }}/api/v3/core/groups/?page={page}&page_size=1000'
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, context=ctx, timeout=30) as resp:
                      data = json.loads(resp.read().decode())
                      results = data.get('results', [])
                      groups.extend(results)
                      if not data.get('pagination', {}).get('next'):
                          break
                      page += 1
              except Exception as e:
                  print(f'Group page {page} fetch failed: {e}')
                  break

          to_delete = [
              g['pk'] for g in groups 
              if not g.get('is_superuser') 
              and g.get('name') not in ['authentik Admins']
          ]

          def delete_group(pk):
              url = f'{{ vault_authentik_url }}/api/v3/core/groups/{pk}/'
              del_req = urllib.request.Request(url, headers=headers, method='DELETE')
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(del_req, context=ctx, timeout=15) as resp:
                          return
                  except Exception:
                      time.sleep(0.3)

          with ThreadPoolExecutor(max_workers=25) as executor:
              executor.map(delete_group, to_delete)
          "

    # -------------------------------------------------------------------------
    # 3. Local Dashboard Dynamic State JSON Reset
    # -------------------------------------------------------------------------
    - name: Reset dynamic report state JSON files
      ansible.builtin.copy:
        content: '[]'
        dest: "{{ item }}"
        mode: '0644'
      loop:
        - /tmp/dynamic_ad_users.json
        - /tmp/dynamic_inactive_users.json
        - /tmp/dynamic_ad_group_assignments.json
        - /tmp/dynamic_user_group_assignments.json
      ignore_errors: true

# =============================================================================
# Play 2: Active Directory Cleanup (Single-Session Bulk Array Purge)
# =============================================================================
- name: Environment Reset - Wipe Active Directory
  hosts: win_dc
  gather_facts: false
  vars_files:
    - /root/ansible/vars/vault.yml

  tasks:
    - name: Bulk remove non-system active & disabled users from AD
      ansible.windows.win_powershell:
        script: |
          $Excluding = @('Administrator', 'Guest', 'krbtgt', 'Domain Admins', 'Domain Users')
          $SearchBases = @(
              "CN=Users,DC=apex,DC=lab",
              "OU=APEX Lab,DC=apex,DC=lab",
              "OU=Users - Disabled,DC=apex,DC=lab"
          )

          foreach ($base in $SearchBases) {
              $users = Get-ADUser -Filter * -SearchBase $base -SearchScope Subtree -ErrorAction SilentlyContinue | 
                Where-Object { $Excluding -notcontains $_.Name -and $_.Name -notlike "HealthMailbox*" }
              
              if ($users) {
                  $users | Remove-ADUser -Confirm:$false -ErrorAction SilentlyContinue
              }
          }

    - name: Bulk remove department security groups from AD
      ansible.windows.win_powershell:
        script: |
          $Excluding = @('Domain Admins', 'Domain Users', 'Domain Guests', 'Enterprise Admins', 'Schema Admins')
          $groups = Get-ADGroup -Filter * -SearchBase "OU=APEX Lab,DC=apex,DC=lab" -SearchScope Subtree -ErrorAction SilentlyContinue | 
            Where-Object { $Excluding -notcontains $_.Name }
          
          if ($groups) {
              $groups | Remove-ADGroup -Confirm:$false -ErrorAction SilentlyContinue
          }

# =============================================================================
# Play 3: Reset Web Dashboard Reports (Direct Local Publish)
# =============================================================================
- name: Environment Reset - Publish Clean Slate Web Dashboard
  hosts: localhost
  gather_facts: true
  vars_files:
    - /root/ansible/vars/vault.yml

  tasks:
    - name: Render and publish reset HTML reports directly to Nginx web root
      ansible.builtin.template:
        src: "/root/ansible/templates/{{ item.src }}"
        dest: "/var/www/html/{{ item.dest }}"
        mode: '0644'
      loop:
        - { src: "index.html.j2", dest: "index.html" }
        - { src: "active.html.j2", dest: "active.html" }
        - { src: "disabled.html.j2", dest: "disabled.html" }
        - { src: "logs.html.j2", dest: "logs.html" }
      vars:
        sync_result:
          rc: 0
          delta: "0:00:01.000000"
        raw_events:
          - "--- Environment Reset Executed: Clean Slate ---"
        active_users_list: []
        dynamic_inactive_users: []
        overall_status: "SUCCESS"
        postgres_status: "SUCCESS"
        authentik_status: "SUCCESS"
        ad_status: "SUCCESS"
        count_hires: 0
        count_transfers: 0
        count_terminations: 0
        total_events: 0
        total_active_managed: 0
        est_time_saved_mins: 0

    - name: Reset confirmation message
      ansible.builtin.debug:
        msg: "Environment reset complete. All backend systems purged and web dashboard reset to clean state."