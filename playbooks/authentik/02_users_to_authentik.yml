---
# ==============================================================================
# Sub-Playbook 2: Provision Active HR Users and Assign Group Memberships
# ==============================================================================
- name: Step 2 - Provision Active Users & Bind to Authentik Groups (High-Speed Parallel)
  hosts: localhost
  gather_facts: false

  vars_files:
    - "{{ playbook_dir }}/../../vars/vault.yml"

  vars:
    db_host: "10.2.8.106"
    db_port: 5432
    db_name: "hr_db"

  tasks:
    - name: Execute High-Speed Parallel Authentik User & Group Sync
      ansible.builtin.command:
        cmd: "python3 {{ playbook_dir }}/sync_authentik.py"
      environment:
        AUTHENTIK_URL: "{{ vault_authentik_url }}"
        AUTHENTIK_TOKEN: "{{ vault_authentik_token }}"
        DB_HOST: "{{ db_host }}"
        DB_PORT: "{{ db_port | string }}"
        DB_NAME: "{{ db_name }}"
        DB_USER: "{{ vault_db_user }}"
        DB_PASSWORD: "{{ vault_db_password }}"
      register: authentik_sync_out
      changed_when: "'Provisioning' in authentik_sync_out.stdout or 'Binding' in authentik_sync_out.stdout"

    - name: Display Authentik Sync Execution Log
      ansible.builtin.debug:
        msg: "{{ authentik_sync_out.stdout_lines }}"