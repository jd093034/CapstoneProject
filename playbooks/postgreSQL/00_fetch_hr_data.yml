---
- name: Extract Identity Lifecycle Data from PostgreSQL HR Database
  hosts: localhost
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../../vars/vault.yml"

  vars:
    db_host: "10.2.8.106"
    db_port: 5432
    db_name: "hr_db"

  tasks:
    - name: Query Active Employees from PostgreSQL
      community.postgresql.postgresql_query:
        login_db: "{{ db_name }}"
        login_host: "{{ db_host }}"
        login_port: "{{ db_port }}"
        login_user: "{{ vault_db_user }}"
        login_password: "{{ vault_db_password }}"
        query: "SELECT username, email, first_name, last_name, department FROM employees WHERE status = 'ACTIVE';"
      register: active_hr_users

    - name: Query Inactive Employees from PostgreSQL with Offboarding Metadata
      community.postgresql.postgresql_query:
        login_db: "{{ db_name }}"
        login_host: "{{ db_host }}"
        login_port: "{{ db_port }}"
        login_user: "{{ vault_db_user }}"
        login_password: "{{ vault_db_password }}"
        query: |
          SELECT 
            username, 
            email, 
            first_name, 
            last_name, 
            department,
            COALESCE(terminated_at, NOW())::text AS terminated_at,
            COALESCE(legal_hold, FALSE) AS legal_hold
          FROM employees 
          WHERE status IN ('INACTIVE', 'TERMINATED');
      register: inactive_hr_users

    - name: Query User-to-Group Mappings from PostgreSQL
      community.postgresql.postgresql_query:
        login_db: "{{ db_name }}"
        login_host: "{{ db_host }}"
        login_port: "{{ db_port }}"
        login_user: "{{ vault_db_user }}"
        login_password: "{{ vault_db_password }}"
        query: "SELECT department AS group, array_agg(username) AS members FROM employees WHERE status = 'ACTIVE' GROUP BY department;"
      register: hr_group_mappings

    - name: Map PostgreSQL rows into dynamic pipeline facts
      ansible.builtin.set_fact:
        dynamic_ad_users: "{{ active_hr_users.query_result | flatten }}"
        dynamic_inactive_users: "{{ inactive_hr_users.query_result | flatten }}"
        dynamic_user_group_assignments: >-
          [
          {% for row in hr_group_mappings.query_result | flatten %}
            {
              "group": "{{ row.group }}",
              "members": { "add": {{ row.members | to_json }} }
            }{% if not loop.last %},{% endif %}
          {% endfor %}
          ]

    - name: Save active users to temp JSON file
      ansible.builtin.copy:
        content: "{{ {'dynamic_ad_users': dynamic_ad_users} | to_nice_json }}"
        dest: "/tmp/dynamic_ad_users.json"
        mode: '0644'

    - name: Save inactive users to temp JSON file
      ansible.builtin.copy:
        content: "{{ {'dynamic_inactive_users': dynamic_inactive_users} | to_nice_json }}"
        dest: "/tmp/dynamic_inactive_users.json"
        mode: '0644'

    - name: Save group assignments to temp JSON file
      ansible.builtin.copy:
        content: "{{ dynamic_user_group_assignments | from_json | to_nice_json }}"
        dest: "/tmp/dynamic_user_group_assignments.json"
        mode: '0644'

    - name: Display Extracted Active HR Users Data
      ansible.builtin.debug:
        var: dynamic_ad_users

    - name: Display Extracted Inactive HR Users Data
      ansible.builtin.debug:
        var: dynamic_inactive_users

    - name: Display Extracted Group Mappings
      ansible.builtin.debug:
        var: dynamic_user_group_assignments