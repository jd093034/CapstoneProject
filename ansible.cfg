[defaults]
vault_password_file = /root/ansible/vars/.vault_pass
inventory = inventory/hosts
deprecation_warnings = False

# Hde all skipped hosts and skipped loop items completely
display_skipped_hosts = False

# Use clean. YAML output
stdout_callback = default

# comment this out
result_format = yaml

#Optional: Only show changed and failed tasks to make output ultra-minimal
# display_ok_hosts = False

