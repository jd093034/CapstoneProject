---
# ==============================================================================
# Sub-Playbook 3: Deprovision Inactive Accounts & Retention Management in Authentik
# ==============================================================================
- name: Step 3 - Deprovision Inactive Accounts & Manage Retention in Authentik
  hosts: localhost
  gather_facts: false

  vars_files:
    - "{{ playbook_dir }}/../../vars/vault.yml"

  vars:
    db_host: "10.2.8.106"
    db_port: 5432
    db_name: "hr_db"

  tasks:
    - name: Execute High-Speed Direct PostgreSQL & Authentik Deprovisioning Engine
      ansible.builtin.command:
        cmd: |
          python3 -c "
          import os, sys, urllib.request, json, ssl, time
          from concurrent.futures import ThreadPoolExecutor
          import psycopg2
          from psycopg2.extras import RealDictCursor

          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE

          raw_url = os.getenv('AUTHENTIK_URL', 'http://10.2.8.105:9000').rstrip('/')
          token = os.getenv('AUTHENTIK_TOKEN')
          db_host = os.getenv('DB_HOST', '10.2.8.106')
          db_port = int(os.getenv('DB_PORT', '5432'))
          db_name = os.getenv('DB_NAME', 'hr_db')
          db_user = os.getenv('DB_USER', 'postgres')
          db_pass = os.getenv('DB_PASSWORD', 'MySecretAnsibleToken123!')

          headers = {
              'Authorization': f'Bearer {token}',
              'Content-Type': 'application/json'
          }

          # 1. Fetch terminated identities directly from PostgreSQL database
          try:
              conn = psycopg2.connect(host=db_host, port=db_port, dbname=db_name, user=db_user, password=db_pass)
              with conn.cursor(cursor_factory=RealDictCursor) as cur:
                  cur.execute('''
                      SELECT 
                        username, 
                        email, 
                        COALESCE(terminated_at, NOW())::text AS terminated_at,
                        COALESCE(legal_hold, FALSE) AS legal_hold,
                        ROUND(EXTRACT(EPOCH FROM (NOW() - COALESCE(terminated_at, NOW()))) / 86400) AS days_since_termination
                      FROM employees 
                      WHERE status = 'TERMINATED';
                  ''')
                  terminated_records = cur.fetchall()
              conn.close()
          except Exception as e:
              print(f'[!] DB Query Error: {e}')
              sys.exit(1)

          if not terminated_records:
              print('[*] No terminated accounts found in PostgreSQL.')
              sys.exit(0)

          # 2. Fetch existing users from Authentik (Page Size 1000)
          authentik_users = {}
          page = 1
          while True:
              url = f'{raw_url}/api/v3/core/users/?page={page}&page_size=1000'
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, context=ctx, timeout=30) as resp:
                      data = json.loads(resp.read().decode())
                      results = data.get('results', [])
                      for u in results:
                          authentik_users[u.get('username')] = u
                      if not data.get('pagination', {}).get('next'):
                          break
                      page += 1
              except Exception as e:
                  print(f'Fetch page {page} error: {e}')
                  break

          # 3. Categorize accounts for offboarding actions
          to_deactivate = []
          to_purge = []

          for hr in terminated_records:
              username = hr.get('username')
              if username in authentik_users:
                  user_obj = authentik_users[username]
                  pk = user_obj.get('pk')
                  is_active = user_obj.get('is_active', False)
                  legal_hold = bool(hr.get('legal_hold', False))
                  days_since_term = int(float(hr.get('days_since_termination') or 0))

                  if days_since_term <= 30 and is_active:
                      to_deactivate.append((username, pk))
                  elif days_since_term > 30 and not legal_hold:
                      to_purge.append((username, pk))

          # 4. Parallel worker functions
          def deactivate(item):
              username, pk = item
              url = f'{raw_url}/api/v3/core/users/{pk}/'
              req = urllib.request.Request(url, headers=headers, method='PATCH', data=json.dumps({'is_active': False}).encode())
              try:
                  with urllib.request.urlopen(req, context=ctx, timeout=10):
                      pass
              except Exception:
                  pass

          def purge(item):
              username, pk = item
              url = f'{raw_url}/api/v3/core/users/{pk}/'
              req = urllib.request.Request(url, headers=headers, method='DELETE')
              try:
                  with urllib.request.urlopen(req, context=ctx, timeout=10):
                      pass
              except Exception:
                  pass

          with ThreadPoolExecutor(max_workers=25) as executor:
              list(executor.map(deactivate, to_deactivate))
              list(executor.map(purge, to_purge))

          print(f'[+] Authentik Deprovisioning Complete: Deactivated {len(to_deactivate)}, Purged {len(to_purge)} expired accounts.')
          "
      environment:
        AUTHENTIK_URL: "{{ vault_authentik_url }}"
        AUTHENTIK_TOKEN: "{{ vault_authentik_token }}"
        DB_HOST: "{{ db_host }}"
        DB_PORT: "{{ db_port | string }}"
        DB_NAME: "{{ db_name }}"
        DB_USER: "{{ vault_db_user }}"
        DB_PASSWORD: "{{ vault_db_password }}"
      register: deprov_result

    - name: Display Authentik Deprovisioning Execution Summary
      ansible.builtin.debug:
        msg: "{{ deprov_result.stdout_lines }}"