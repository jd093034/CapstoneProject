---
# ==============================================================================
# Playbook: Provision Active Users & Sync Groups in Active Directory
# ==============================================================================
- name: Sync Active HR Users to Active Directory
  hosts: win_dc
  gather_facts: false

  vars_files:
    - "{{ playbook_dir }}/../../vars/vault.yml"

  tasks:
    - name: Push active users JSON file to Windows DC
      ansible.windows.win_copy:
        src: /tmp/dynamic_ad_users.json
        dest: C:\Windows\Temp\dynamic_ad_users.json

    - name: Execute Bulk Active Directory Sync (Single WinRM Session)
      ansible.windows.win_shell: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/sync_users.ps1') }}"
      environment:
        DEFAULT_PASSWORD: "{{ default_user_password }}"
