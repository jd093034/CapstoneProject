---
- name: End-to-End HR Lifecycle Automation & Synchronization Pipeline
  hosts: localhost
  gather_facts: true
  vars_files:
    - vars/vault.yml

  vars_prompt:
    - name: req_hires
      prompt: "How many NEW HIRES do you want to generate?"
      default: "3"
      private: false

    - name: req_transfers
      prompt: "How many DEPARTMENT TRANSFERS do you want to generate?"
      default: "1"
      private: false

    - name: req_terms
      prompt: "How many TERMINATIONS do you want to generate?"
      default: "1"
      private: false

  tasks:
    # Phase 1: Synthetic Data Generation
    # -------------------------------------------------------------------------
    - name: "Phase 1 | Execute Synthetic HR Data Generator"
      ansible.builtin.command:
        cmd: >
          python3 scripts/generate_hr_data.py
          --hires {{ req_hires }}
          --transfers {{ req_transfers }}
          --terms {{ req_terms }}
      register: hr_script_output
      changed_when: true

    - name: "Phase 1 | Extract Generated Log Lines"
      ansible.builtin.debug:
        msg: "{{ hr_script_output.stdout_lines }}"

    # Phase 2: Orchestrate Master Synchronization Playbook
    # -------------------------------------------------------------------------
    - name: "Phase 2 | Trigger Master Synchronization Playbook (site.yml)"
      ansible.builtin.command:
        cmd: >
          ansible-playbook -i /root/ansible/inventory/hosts.ini
          /root/ansible/playbooks/site.yml
          --vault-password-file /root/ansible/vars/.vault_pass
          -f 10
      environment:
        ANSIBLE_HOST_KEY_CHECKING: "False"
      register: sync_result
      ignore_errors: true

    # Phase 3: Render Terminal Output & Summary Report
    # -------------------------------------------------------------------------
    - name: "Phase 3 | Render Executive Lifecycle Summary"
      ansible.builtin.debug:
        msg: |
          =====================================================
                    HR LIFECYCLE SYNC EXECUTION RESULTS         
          =====================================================
          {{ sync_result.stdout }}

    # Phase 4: Generate HTML Status Report for Web Dashboard
    # -------------------------------------------------------------------------
    - name: "Phase 4 | Ensure reports directory exists locally"
      ansible.builtin.file:
        path: "/root/ansible/reports"
        state: directory
        mode: '0755'

    - name: "Phase 4 | Load active users JSON for report rendering"
      ansible.builtin.set_fact:
        active_users_raw: "{{ lookup('ansible.builtin.file', '/tmp/dynamic_ad_users.json', errors='ignore') | default('[]', true) | from_json }}"

    - name: "Phase 4 | Load inactive users JSON for report rendering"
      ansible.builtin.set_fact:
        inactive_users_raw: "{{ lookup('ansible.builtin.file', '/tmp/dynamic_inactive_users.json', errors='ignore') | default('[]', true) | from_json }}"

    - name: "Phase 4 | Extract raw log events, execution status, and research analytics"
      ansible.builtin.set_fact:
        raw_events: "{{ hr_script_output.stdout_lines | default([]) }}"
        active_users_list: >-
          {{
            active_users_raw.dynamic_ad_users
            if (active_users_raw is mapping and 'dynamic_ad_users' in active_users_raw)
            else (active_users_raw if active_users_raw is sequence else [])
          }}
        dynamic_inactive_users: >-
          {{
            inactive_users_raw.dynamic_inactive_users
            if (inactive_users_raw is mapping and 'dynamic_inactive_users' in inactive_users_raw)
            else (inactive_users_raw if inactive_users_raw is sequence else [])
          }}
        overall_status: "{{ 'SUCCESS' if ('failed=0' in sync_result.stdout and 'unreachable=0' in sync_result.stdout) or sync_result.rc == 0 else 'FAILED' }}"
        postgres_status: "{{ 'SUCCESS' if 'failed=0' in sync_result.stdout and 'unreachable=0' in sync_result.stdout else 'FAILED' }}"
        authentik_status: "{{ 'SUCCESS' if 'failed=0' in sync_result.stdout and 'unreachable=0' in sync_result.stdout else 'FAILED' }}"
        ad_status: "{{ 'SUCCESS' if 'failed=0' in sync_result.stdout and 'unreachable=0' in sync_result.stdout else 'FAILED' }}"

        count_hires: "{{ hr_script_output.stdout_lines | select('search', 'HIRED:') | list | length }}"
        count_transfers: "{{ hr_script_output.stdout_lines | select('search', 'TRANSFERRED:') | list | length }}"
        count_terminations: "{{ hr_script_output.stdout_lines | select('search', 'TERMINATED:') | list | length }}"
        total_events: "{{ (hr_script_output.stdout_lines | select('search', 'HIRED:') | list | length) + (hr_script_output.stdout_lines | select('search', 'TRANSFERRED:') | list | length) + (hr_script_output.stdout_lines | select('search', 'TERMINATED:') | list | length) }}"
        total_active_managed: "{{ active_users_raw.dynamic_ad_users | default([]) | length if (active_users_raw is mapping and 'dynamic_ad_users' in active_users_raw) else (active_users_raw | length if active_users_raw is sequence else 0) }}"
        est_time_saved_mins: "{{ ((hr_script_output.stdout_lines | select('search', 'HIRED:') | list | length) + (hr_script_output.stdout_lines | select('search', 'TRANSFERRED:') | list | length) + (hr_script_output.stdout_lines | select('search', 'TERMINATED:') | list | length)) * 15 }}"

    - name: "Phase 4 | Render Multi-Page HTML Reports locally"
      ansible.builtin.template:
        src: "/root/ansible/templates/{{ item.src }}"
        dest: "/root/ansible/reports/{{ item.dest }}"
        mode: '0644'
      loop:
        - { src: "index.html.j2", dest: "index.html" }
        - { src: "active.html.j2", dest: "active.html" }
        - { src: "disabled.html.j2", dest: "disabled.html" }
        - { src: "logs.html.j2", dest: "logs.html" }
      vars:
        sync_result: "{{ sync_result }}"
        raw_events: "{{ raw_events }}"
        active_users_list: "{{ active_users_list }}"
        dynamic_inactive_users: "{{ dynamic_inactive_users }}"
        overall_status: "{{ overall_status }}"
        postgres_status: "{{ postgres_status }}"
        authentik_status: "{{ authentik_status }}"
        ad_status: "{{ ad_status }}"
        count_hires: "{{ count_hires }}"
        count_transfers: "{{ count_transfers }}"
        count_terminations: "{{ count_terminations }}"
        total_events: "{{ total_events }}"
        total_active_managed: "{{ total_active_managed }}"
        est_time_saved_mins: "{{ est_time_saved_mins }}"

    - name: "Phase 4 | Publish HTML Reports to Nginx web root on 10.2.8.68"
      ansible.builtin.copy:
        src: "/root/ansible/reports/"
        dest: "/var/www/html/"
        mode: '0644'
      delegate_to: 10.2.8.68
      vars:
        ansible_connection: ssh
        ansible_port: 22
        ansible_user: "{{ vault_ssh_user }}"
        ansible_password: "{{ vault_ssh_password }}"

    - name: "Phase 4 | Fail playbook if overall status is FAILED"
      ansible.builtin.fail:
        msg: "Master synchronization pipeline reported system failures. Check logs above."
      when: overall_status == 'FAILED'