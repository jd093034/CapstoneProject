---
# ==============================================================================
# Sub-Playbook 3: Deprovision Inactive Accounts & Retention Management in Authentik
# ==============================================================================
- name: Step 3 - Deprovision Inactive Accounts & Manage Retention in Authentik
  hosts: localhost
  gather_facts: false

  vars_files:
    - "{{ playbook_dir }}/../../vars/vault.yml"

  vars:
    db_host: "10.2.8.106"
    db_port: 5432
    db_name: "hr_db"

  tasks:
    - name: Fetch terminated employee records from PostgreSQL
      community.postgresql.postgresql_query:
        login_host: "{{ db_host }}"
        login_port: "{{ db_port }}"
        login_db: "{{ db_name }}"
        login_user: "{{ vault_db_user }}"
        login_password: "{{ vault_db_password }}"
        query: |
          SELECT 
            username, 
            email, 
            COALESCE(terminated_at, NOW())::text AS terminated_at,
            COALESCE(legal_hold, FALSE) AS legal_hold,
            ROUND(EXTRACT(EPOCH FROM (NOW() - COALESCE(terminated_at, NOW()))) / 86400) AS days_since_termination
          FROM employees 
          WHERE status = 'TERMINATED';
      register: terminated_hr_users

    - name: Fetch existing users from Authentik
      ansible.builtin.uri:
        url: "{{ vault_authentik_url }}/api/v3/core/users/?page_size=1000"
        method: GET
        headers:
          Authorization: "Bearer {{ vault_authentik_token }}"
          Accept: "application/json"
        status_code: [200]
        validate_certs: false
      register: authentik_users

    - name: Build list of terminated matches
      ansible.builtin.set_fact:
        terminated_matches: "{{ matches_raw | from_json }}"
      vars:
        matches_raw: >-
          {% set matches = [] %}
          {% for hr in (terminated_hr_users.query_result | default([])) %}
            {% set match = (authentik_users.json.results | default([]) | selectattr('username', 'eq', hr.username) | list) %}
            {% if match | length > 0 %}
              {% set _ = matches.append({
                'username': hr.username,
                'pk': match[0].pk,
                'is_active': (match[0].is_active | bool),
                'legal_hold': (hr.legal_hold | default(false) | bool),
                'days_since_term': (hr.days_since_termination | default(0) | int)
              }) %}
            {% endif %}
          {% endfor %}
          {{ matches | to_json }}

    # STAGE 1: Day 0 Immediate Offboarding (Deactivate Account)
    - name: Deactivate active terminated accounts in Authentik
      ansible.builtin.uri:
        url: "{{ vault_authentik_url }}/api/v3/core/users/{{ item.pk }}/"
        method: PATCH
        headers:
          Authorization: "Bearer {{ vault_authentik_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          is_active: false
        status_code: [200, 204]
        validate_certs: false
      loop: "{{ terminated_matches }}"
      when:
        - terminated_matches is sequence
        - terminated_matches is not mapping
        - terminated_matches | length > 0
        - item.days_since_term <= 30
        - item.is_active == true
      loop_control:
        label: "Deactivating: {{ item.username }}"

    # STAGE 3: Hard Delete (> 30 Days Retention Expired, Excluding Legal Hold)
    - name: Hard delete expired terminated accounts from Authentik (> 30 Days)
      ansible.builtin.uri:
        url: "{{ vault_authentik_url }}/api/v3/core/users/{{ item.pk }}/"
        method: DELETE
        headers:
          Authorization: "Bearer {{ vault_authentik_token }}"
        status_code: [204, 404]
        validate_certs: false
      loop: "{{ terminated_matches }}"
      when:
        - terminated_matches is sequence
        - terminated_matches is not mapping
        - terminated_matches | length > 0
        - item.days_since_term > 30
        - item.legal_hold == false
      loop_control:
        label: "Purging expired account: {{ item.username }}"