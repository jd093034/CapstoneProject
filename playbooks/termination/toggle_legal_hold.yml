# Three dashes mark the start of a YAML configuration file for Ansible
---
# --- Playbook: Turn a user's Legal Hold flag ON or OFF and update the web dashboard ---
- name: Identity Lifecycle - Toggle Legal Hold State & Refresh Dashboard
  # "hosts: localhost" runs this directly on our Linux Ansible control machine
  hosts: localhost
  # "gather_facts: true" is turned ON so the HTML dashboard template can stamp the current date/time on the page
  gather_facts: true
  # Load our encrypted password file (created with ansible-vault) so database credentials stay hidden
  vars_files:
    - /root/ansible/vars/vault.yml

  # Connection details for our simulated SIS database running in PostgreSQL
  vars:
    db_host: "10.2.8.106"
    db_port: 5432
    db_name: "hr_db"

  tasks:
    # Step 1: Safety check—stop right away with a clear error message if nobody told the playbook
    # which username to update (passed via command line like: -e "target_user=jsmith1").
    - name: Validate target_user argument
      ansible.builtin.fail:
        msg: "Missing required argument: target_user"
      when: target_user is not defined or target_user == ""

    # Step 2: Flip the legal_hold column in PostgreSQL for that specific user.
    # Double curly braces {{ ... }} tell Ansible "plug in the saved variable value here."
    # "| default(5432)" is a safety net: if db_port isn't set, use port 5432.
    - name: Update Legal Hold status in PostgreSQL
      community.postgresql.postgresql_query:
        login_db: "{{ db_name }}"
        login_host: "{{ db_host }}"
        login_port: "{{ db_port | default(5432) }}"
        login_user: "{{ vault_db_user }}"
        login_password: "{{ vault_db_password }}"
        # The pipe "|" lets us write a clean multi-line SQL query.
        # "%s" are safe placeholders filled in by positional_args below (prevents SQL injection).
        # "::boolean" converts the text "true" or "false" into a real PostgreSQL TRUE/FALSE value.
        query: |
          UPDATE employees 
          SET legal_hold = %s::boolean 
          WHERE username = %s;
        # First %s gets hold_state (defaults to 'true' if not specified), second %s gets target_user
        positional_args:
          - "{{ hold_state | default('true') }}"
          - "{{ target_user }}"

    # Step 3: Pull the freshly updated list of all TERMINATED users so the dashboard reflects the change
    - name: Fetch updated inactive employees from PostgreSQL
      community.postgresql.postgresql_query:
        login_db: "{{ db_name }}"
        login_host: "{{ db_host }}"
        login_port: "{{ db_port | default(5432) }}"
        login_user: "{{ vault_db_user }}"
        login_password: "{{ vault_db_password }}"
        query: |
          SELECT username, first_name, last_name, email, department, terminated_at, legal_hold
          FROM employees
          WHERE status = 'TERMINATED';
      # "register" saves the database results into inactive_hr_users
      register: inactive_hr_users

    # Step 4: Make sure the database results are formatted as a clean list for the HTML template.
    # ">-" combines the lines below into one clean result.
    # "is sequence and is not mapping" is a Jinja2 safety check: it makes sure query_result is an
    # actual list of rows (and not a single dictionary or empty value); if not, it falls back to [].
    - name: Normalize inactive users list
      ansible.builtin.set_fact:
        dynamic_inactive_users: >-
          {{
            inactive_hr_users.query_result
            if (inactive_hr_users.query_result is defined and inactive_hr_users.query_result is sequence and inactive_hr_users.query_result is not mapping)
            else []
          }}

    # Step 5: Rebuild the Disabled Accounts webpage (/var/www/html/disabled.html) from our Jinja2 (.j2)
    # template so the updated Legal Hold badge shows up in Nginx immediately.
    # "mode: '0644'" sets standard Linux web permissions (owner can edit, Nginx/browsers can read).
    - name: Render updated disabled.html report
      ansible.builtin.template:
        src: /root/ansible/templates/disabled.html.j2
        dest: /var/www/html/disabled.html
        mode: '0644'