[defaults]
vault_password_file = /root/ansible/vars/.vault_pass
inventory = inventory/hosts
deprecation_warnings = False

# Hide all skipped hosts and skipped loop items completely
display_skipped_hosts = False

# Use clean YAML output
stdout_callback = default
result_format = yaml

# Performance Optimizations
forks = 20
gathering = explicit

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s