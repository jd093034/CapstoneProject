---
# =============================================================================
# Play 1: PostgreSQL & Authentik Cleanup (Runs on Host)
# =============================================================================
- name: Environment Reset - Wipe Database and Authentik
  hosts: localhost
  gather_facts: false
  vars_files:
    - /root/ansible/vars/vault.yml

  vars:
    db_host: "10.2.8.106"
    db_port: 5432
    db_name: "hr_db"

  tasks:
    # -------------------------------------------------------------------------
    # 1. PostgreSQL Cleanup (Bulk Truncate - Instant)
    # -------------------------------------------------------------------------
    - name: Purge PostgreSQL HR database tables
      community.postgresql.postgresql_query:
        login_db: "{{ db_name }}"
        login_host: "{{ db_host }}"
        login_port: "{{ db_port }}"
        login_user: "{{ vault_db_user }}"
        login_password: "{{ vault_db_password }}"
        query: |
          DO $$ 
          DECLARE 
              stmt text;
          BEGIN 
              SELECT 'TRUNCATE TABLE ' || string_agg(quote_ident(tablename), ', ') || ' CASCADE;'
              INTO stmt
              FROM pg_tables 
              WHERE schemaname = 'public';
              
              IF stmt IS NOT NULL THEN
                  EXECUTE stmt;
              END IF;
          END $$;

    # -------------------------------------------------------------------------
    # 2. Authentik Bulk Cleanup (Page Size 5000 with 120s Extended Timeout)
    # -------------------------------------------------------------------------
    - name: Bulk purge non-system users from Authentik
      ansible.builtin.command:
        cmd: |
          python3 -c "
          import urllib.request, json, ssl, sys, time
          from concurrent.futures import ThreadPoolExecutor

          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE

          raw_url = '{{ vault_authentik_url }}'.rstrip('/')
          token = '{{ vault_authentik_token }}'

          headers = {
              'Authorization': f'Bearer {token}',
              'Content-Type': 'application/json'
          }

          users = []
          system_accounts = {'akadmin', 'anonymous'}
          page = 1

          while True:
              url = f'{raw_url}/api/v3/core/users/?page={page}&page_size=5000'
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, context=ctx, timeout=120) as resp:
                      data = json.loads(resp.read().decode())
                      results = data.get('results', [])
                      users.extend(results)
                      if not data.get('pagination', {}).get('next'):
                          break
                      page += 1
              except Exception as e:
                  print(f'[!] ERROR: Authentik user query failed on page {page}: {e}', file=sys.stderr)
                  sys.exit(1)

          to_delete = [
              u['pk'] for u in users 
              if u.get('username') not in system_accounts 
              and not u.get('username', '').startswith('ak-outpost-')
          ]

          print(f'[*] Found {len(to_delete)} accounts to delete from Authentik.')

          def delete_user(pk):
              del_url = f'{raw_url}/api/v3/core/users/{pk}/'
              del_req = urllib.request.Request(del_url, headers=headers, method='DELETE')
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(del_req, context=ctx, timeout=15) as resp:
                          return True
                  except Exception:
                      time.sleep(0.2)
              return False

          with ThreadPoolExecutor(max_workers=30) as executor:
              results = list(executor.map(delete_user, to_delete))

          print(f'[+] Successfully purged {results.count(True)} / {len(to_delete)} accounts.')
          "

    - name: Bulk purge custom groups from Authentik
      ansible.builtin.command:
        cmd: |
          python3 -c "
          import urllib.request, json, ssl, sys, time
          from concurrent.futures import ThreadPoolExecutor

          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE

          raw_url = '{{ vault_authentik_url }}'.rstrip('/')
          token = '{{ vault_authentik_token }}'

          headers = {
              'Authorization': f'Bearer {token}',
              'Content-Type': 'application/json'
          }

          groups = []
          page = 1

          while True:
              url = f'{raw_url}/api/v3/core/groups/?page={page}&page_size=5000'
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, context=ctx, timeout=120) as resp:
                      data = json.loads(resp.read().decode())
                      results = data.get('results', [])
                      groups.extend(results)
                      if not data.get('pagination', {}).get('next'):
                          break
                      page += 1
              except Exception as e:
                  print(f'[!] ERROR: Authentik group query failed on page {page}: {e}', file=sys.stderr)
                  sys.exit(1)

          to_delete = [
              g['pk'] for g in groups 
              if not g.get('is_superuser') 
              and g.get('name') not in ['authentik Admins']
          ]

          print(f'[*] Found {len(to_delete)} custom groups to delete from Authentik.')

          def delete_group(pk):
              del_url = f'{raw_url}/api/v3/core/groups/{pk}/'
              del_req = urllib.request.Request(del_url, headers=headers, method='DELETE')
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(del_req, context=ctx, timeout=15) as resp:
                          return True
                  except Exception:
                      time.sleep(0.2)
              return False

          with ThreadPoolExecutor(max_workers=30) as executor:
              results = list(executor.map(delete_group, to_delete))

          print(f'[+] Successfully purged {results.count(True)} / {len(to_delete)} groups.')
          "

    # -------------------------------------------------------------------------
    # 3. Local Dashboard Dynamic State JSON Reset
    # -------------------------------------------------------------------------
    - name: Reset dynamic report state JSON files
      ansible.builtin.copy:
        content: '[]'
        dest: "{{ item }}"
        mode: '0644'
      loop:
        - /tmp/dynamic_ad_users.json
        - /tmp/dynamic_inactive_users.json
        - /tmp/dynamic_ad_group_assignments.json
        - /tmp/dynamic_user_group_assignments.json
      ignore_errors: true

# =============================================================================
# Play 2: Active Directory K-12 Cleanup (Single-Session Bulk Array Purge)
# =============================================================================
- name: Environment Reset - Wipe Active Directory
  hosts: win_dc
  gather_facts: false
  vars_files:
    - /root/ansible/vars/vault.yml

  tasks:
    - name: Bulk remove active & disabled users from AD K-12 containers
      ansible.windows.win_powershell:
        script: |
          Import-Module ActiveDirectory
          $Excluding = @('Administrator', 'Guest', 'krbtgt', 'Domain Admins', 'Domain Users')
          $SearchBases = @(
              "OU=APEX K12,DC=apex,DC=lab",
              "OU=Users - Disabled,OU=APEX K12,DC=apex,DC=lab",
              "OU=APEX Lab,DC=apex,DC=lab",
              "OU=Users - Disabled,DC=apex,DC=lab",
              "CN=Users,DC=apex,DC=lab"
          )

          foreach ($base in $SearchBases) {
              if (Get-ADOrganizationalUnit -Filter "DistinguishedName -eq '$base'" -ErrorAction SilentlyContinue) {
                  $users = Get-ADUser -Filter * -SearchBase $base -SearchScope Subtree -ErrorAction SilentlyContinue | 
                    Where-Object { $Excluding -notcontains $_.Name -and $_.Name -notlike "HealthMailbox*" }
                  
                  if ($users) {
                      $users | Remove-ADUser -Confirm:$false -ErrorAction SilentlyContinue
                      Write-Host "[-] Purged $($users.Count) user(s) from $base"
                  }
              }
          }

    - name: Bulk remove GRP_ and department security groups from AD
      ansible.windows.win_powershell:
        script: |
          Import-Module ActiveDirectory
          $Excluding = @('Domain Admins', 'Domain Users', 'Domain Guests', 'Enterprise Admins', 'Schema Admins')
          $GroupBases = @(
              "OU=Groups,OU=APEX K12,DC=apex,DC=lab",
              "OU=APEX K12,DC=apex,DC=lab",
              "OU=APEX Lab,DC=apex,DC=lab"
          )

          foreach ($base in $GroupBases) {
              if (Get-ADOrganizationalUnit -Filter "DistinguishedName -eq '$base'" -ErrorAction SilentlyContinue) {
                  $groups = Get-ADGroup -Filter * -SearchBase $base -SearchScope Subtree -ErrorAction SilentlyContinue | 
                    Where-Object { $Excluding -notcontains $_.Name }
                  
                  if ($groups) {
                      $groups | Remove-ADGroup -Confirm:$false -ErrorAction SilentlyContinue
                      Write-Host "[-] Purged $($groups.Count) security group(s) from $base"
                  }
              }
          }

# =============================================================================
# Play 3: Reset Web Dashboard Reports (Direct Local Publish)
# =============================================================================
- name: Environment Reset - Publish Clean Slate Web Dashboard
  hosts: localhost
  gather_facts: true
  vars_files:
    - /root/ansible/vars/vault.yml

  tasks:
    - name: Render and publish reset HTML reports directly to Nginx web root
      ansible.builtin.template:
        src: "/root/ansible/templates/{{ item.src }}"
        dest: "/var/www/html/{{ item.dest }}"
        mode: '0644'
      loop:
        - { src: "index.html.j2", dest: "index.html" }
        - { src: "active.html.j2", dest: "active.html" }
        - { src: "disabled.html.j2", dest: "disabled.html" }
        - { src: "logs.html.j2", dest: "logs.html" }
      vars:
        sync_result:
          rc: 0
          delta: "0:00:01.000000"
        raw_events:
          - "--- Environment Reset Executed: Clean Slate ---"
        active_users_list: []
        dynamic_inactive_users: []
        overall_status: "SUCCESS"
        postgres_status: "SUCCESS"
        authentik_status: "SUCCESS"
        ad_status: "SUCCESS"
        count_hires: 0
        count_transfers: 0
        count_terminations: 0
        total_events: 0
        total_active_managed: 0
        est_time_saved_mins: 0

    - name: Reset confirmation message
      ansible.builtin.debug:
        msg: "Environment reset complete. All backend systems purged and web dashboard reset to clean state."