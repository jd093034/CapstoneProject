---
- name: Step 3 - Deprovision Inactive Accounts in Authentik
  hosts: localhost
  vars_files:
    - "../../vars/vault.yml"
  tasks:
    - name: Query Authentik status for inactive employees
      ansible.builtin.uri:
        url: "{{ vault_authentik_url }}/api/v3/core/users/?username={{ item.username }}"
        method: GET
        headers:
          Authorization: "Bearer {{ vault_authentik_token }}"
        validate_certs: no
      loop: "{{ dynamic_inactive_users if (dynamic_inactive_users is sequence and dynamic_inactive_users is not mapping) else [] }}"
      register: authentik_inactive_check
      check_mode: no
      when: 
        - dynamic_inactive_users is defined
        - dynamic_inactive_users is sequence
        - dynamic_inactive_users is not mapping
        - dynamic_inactive_users | length > 0

    - name: Deactivate accounts marked inactive in HR DB
      ansible.builtin.uri:
        url: "{{ vault_authentik_url }}/api/v3/core/users/{{ item.json.results[0].pk }}/"
        method: PATCH
        headers:
          Authorization: "Bearer {{ vault_authentik_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          is_active: false
        status_code: 200
        validate_certs: no
      loop: "{{ authentik_inactive_check.results | default([]) }}"
      when: 
        - item.skipped is not defined or not item.skipped
        - item.json is defined
        - item.json.pagination.count > 0
        - item.json.results[0].is_active == true