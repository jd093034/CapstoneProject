# ==============================================================================
# Sub-Playbook 2: Provision Active HR Users and Assign Group Memberships
# ==============================================================================
- name: Step 2 - Provision Active Users & Bind to Authentik Groups
  hosts: localhost
  gather_facts: false

  vars_files:
    - "{{ playbook_dir }}/../../vars/vault.yml"

  tasks:
    - name: Fetch active employee records from PostgreSQL
      community.postgresql.postgresql_query:
        login_host: "{{ db_host }}"
        login_port: "{{ db_port | default(5432) }}"
        login_db: "{{ db_name }}"
        login_user: "{{ vault_db_user }}"
        login_password: "{{ vault_db_password }}"
        query: |
          SELECT 
            username, 
            CONCAT(first_name, ' ', last_name) AS name, 
            email, 
            department
          FROM employees 
          WHERE status = 'ACTIVE';
      register: active_hr_users

    - name: Ensure active user accounts exist in Authentik
      ansible.builtin.uri:
        url: "{{ vault_authentik_url }}/api/v3/core/users/"
        method: POST
        headers:
          Authorization: "Bearer {{ vault_authentik_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          username: "{{ item.username }}"
          name: "{{ item.name }}"
          email: "{{ item.email }}"
          is_active: true
          attributes:
            department: "{{ item.department }}"
        status_code: [201, 400]  # 201 Created, 400 Already Exists
      loop: "{{ active_hr_users.query_result }}"
      register: user_creation_results

    - name: Fetch all current users from Authentik
      ansible.builtin.uri:
        url: "{{ vault_authentik_url }}/api/v3/core/users/?page_size=200"
        method: GET
        headers:
          Authorization: "Bearer {{ vault_authentik_token }}"
          Accept: "application/json"
        status_code: 200
      register: all_authentik_users

    - name: Fetch Authentik group PK mappings
      ansible.builtin.uri:
        url: "{{ vault_authentik_url }}/api/v3/core/groups/?page_size=200"
        method: GET
        headers:
          Authorization: "Bearer {{ vault_authentik_token }}"
          Accept: "application/json"
        status_code: 200
      register: authentik_groups

    - name: Assign active users to their department groups
      ansible.builtin.uri:
        url: "{{ vault_authentik_url }}/api/v3/core/groups/{{ target_group_pk }}/add_user/"
        method: POST
        headers:
          Authorization: "Bearer {{ vault_authentik_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          pk: "{{ matched_user_pk }}"
        status_code: [200, 204]
      vars:
        matched_user: "{{ all_authentik_users.json.results | selectattr('username', 'equalto', item.username) | list | first | default({}) }}"
        matched_group: "{{ authentik_groups.json.results | selectattr('name', 'equalto', item.department) | list | first | default({}) }}"
        matched_user_pk: "{{ matched_user.pk | default(none) }}"
        target_group_pk: "{{ matched_group.pk | default(none) }}"
      loop: "{{ active_hr_users.query_result }}"
      when: 
        - matched_user_pk is not none
        - target_group_pk is not none