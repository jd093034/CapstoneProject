---
- name: Synchronize Active Directory Groups and Membership
  hosts: win_dc
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../../vars/vault.yml"

  tasks:
    - name: Push group assignments JSON payload to Windows DC
      ansible.windows.win_copy:
        src: /tmp/dynamic_ad_group_assignments.json
        dest: C:\Windows\Temp\dynamic_ad_group_assignments.json

    - name: Bulk process AD group creation and membership in single PowerShell session
      ansible.windows.win_powershell:
        script: |
          $GroupPath = "OU=Departments,OU=APEX Lab,DC=apex,DC=lab"
          $JsonPath = "C:\Windows\Temp\dynamic_ad_group_assignments.json"

          if (Test-Path $JsonPath) {
              $GroupData = Get-Content $JsonPath | ConvertFrom-Json

              # 1. Cache existing groups in 1 single LDAP query
              $ExistingGroups = @{}
              Get-ADGroup -Filter * -SearchBase $GroupPath -ErrorAction SilentlyContinue | 
                ForEach-Object { $ExistingGroups[$_.Name] = $_ }

              # 2. Create missing groups
              foreach ($item in $GroupData) {
                  $groupName = $item.group
                  if (-not $ExistingGroups.ContainsKey($groupName)) {
                      New-ADGroup -Name $groupName -GroupScope Global -GroupCategory Security -Path $GroupPath -ErrorAction SilentlyContinue
                  }
              }

              # 3. Bulk append group members
              foreach ($item in $GroupData) {
                  $groupName = $item.group
                  if ($item.members -and $item.members.add -and $item.members.add.Count -gt 0) {
                      # Add-ADGroupMember accepts arrays directly
                      Add-ADGroupMember -Identity $groupName -Members $item.members.add -ErrorAction SilentlyContinue
                  }
              }
          }